name: CI — Mumbai Police Cyber Fraud Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: mumbaicyber
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/secretpassword
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p secretpassword 'RETURN 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 40s
    env:
      ENVIRONMENT: test
      DEBUG: "true"
      SECRET_KEY: ci-test-secret-key
      CSRF_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://postgres:secretpassword@localhost:5432/mumbaicyber
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_URL: redis://localhost:6379/0
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: secretpassword

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Ruff check (non-blocking warnings)
        continue-on-error: true
        run: |
          cd backend
          ruff check app --select E,F --ignore E501

      - name: Run Pytest Suite
        run: |
          cd backend
          pytest -v

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck & Production Build
        run: |
          cd frontend
          npm run build

  # C5: Real Playwright E2E — chromium against backend+frontend with seed data
  e2e-test:
    name: Playwright E2E (demo path)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: mumbaicyber
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/secretpassword
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p secretpassword 'RETURN 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 40s
    env:
      ENVIRONMENT: local
      DEBUG: "true"
      SECRET_KEY: ci-e2e-secret-key
      CSRF_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://postgres:secretpassword@localhost:5432/mumbaicyber
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_URL: redis://localhost:6379/0
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: secretpassword
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
      CI: "true"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend + migrate + seed
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd backend
          alembic upgrade head
          python -m scripts.seed

      - name: Start API server
        run: |
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health

      - name: Install frontend + Playwright Chromium
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Build frontend and start preview
        run: |
          cd frontend
          npm run build
          nohup npx vite preview --host 127.0.0.1 --port 5173 > /tmp/fe.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/ && break
            sleep 2
          done

      - name: Run Playwright demo path + a11y smoke
        run: |
          cd frontend
          npx playwright test --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Honest note (audit H17): this job does NOT deploy to hosting.
  env-matrix-smoke:
    name: Env label smoke (`local` / `staging` / `demo`) — no hosting deploy
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    strategy:
      matrix:
        environment: [local, staging, demo]
    steps:
      - name: Record environment label (no deploy)
        run: |
          echo "Environment label: ${{ matrix.environment }}"
          echo "CI gates passed. Hosted deploy is NOT automated — see docs/security-and-ops-baseline.md §Deploy honesty."
